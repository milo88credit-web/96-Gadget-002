<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>會員專屬活動</title>

  <meta
    name="description"
    content="探索最新會員活動及專屬會員禮遇。"
  >

  <meta property="og:type" content="website">
  <meta property="og:title" content="會員專屬活動">
  <meta
    property="og:description"
    content="探索最新會員活動及專屬會員禮遇。"
  >

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Microsoft JhengHei",
        "Noto Sans TC",
        Arial,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(30, 112, 82, 0.38) 0%,
          rgba(8, 48, 37, 0.20) 38%,
          transparent 62%
        ),
        linear-gradient(
          180deg,
          #09231c 0%,
          #061a15 48%,
          #03100d 100%
        );

      overflow-x: hidden;
    }


    /* =========================
       PAGE
    ========================= */

    .page {
      width: 100%;
      min-height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(26px, env(safe-area-inset-top))
        20px
        max(26px, env(safe-area-inset-bottom));
    }


    /* =========================
       CARD
    ========================= */

    .card {
      position: relative;

      width: 100%;
      max-width: 540px;

      padding:
        66px
        28px
        42px;

      text-align: center;

      border-radius: 30px;

      border:
        1px solid
        rgba(190, 158, 88, 0.25);

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(43, 119, 89, 0.20),
          transparent 43%
        ),
        linear-gradient(
          180deg,
          rgba(12, 48, 38, 0.98) 0%,
          rgba(5, 29, 23, 0.99) 100%
        );

      box-shadow:
        0 30px 85px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);

      overflow: hidden;
    }


    /* Top ambient glow */

    .card::before {
      content: "";

      position: absolute;

      width: 400px;
      height: 350px;

      left: 50%;
      top: -245px;

      transform: translateX(-50%);

      background:
        radial-gradient(
          circle,
          rgba(68, 180, 126, 0.18),
          transparent 68%
        );

      pointer-events: none;
    }


    /* =========================
       OFFER
    ========================= */

    .offer {
      position: relative;

      width: 100%;
    }


    /* =========================
       250%
    ========================= */

    .offer-number {
      position: relative;
      z-index: 2;

      display: inline-block;

      padding-bottom: 6px;

      font-size: clamp(84px, 23vw, 128px);
      line-height: 0.9;

      font-weight: 900;

      letter-spacing: -6px;

      white-space: nowrap;

      background:
        linear-gradient(
          180deg,
          #fff8d6 0%,
          #f9e6a4 20%,
          #eac66c 55%,
          #c99b3f 100%
        );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;

      filter:
        drop-shadow(
          0 5px 0 rgba(77, 47, 5, 0.10)
        )
        drop-shadow(
          0 0 14px rgba(229, 192, 96, 0.16)
        );
    }


    /* =========================
       GOLD LINE
    ========================= */

    .offer::before {
      content: "";

      position: absolute;
      z-index: 1;

      width: 82%;
      height: 1px;

      left: 9%;
      top: 52%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(234, 199, 108, 0.88),
          transparent
        );

      box-shadow:
        0 0 12px rgba(220, 179, 80, 0.34);
    }


    /* =========================
       SPARKS
    ========================= */

    .spark {
      position: absolute;
      z-index: 3;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #fff5c4;

      box-shadow:
        0 0 8px #ffe99a,
        0 0 18px rgba(222, 180, 76, 0.62);
    }

    .spark.one {
      left: 14%;
      top: 7%;
    }

    .spark.two {
      right: 13%;
      bottom: 5%;
    }

    .spark.three {
      left: 50%;
      bottom: 1%;
    }


    /* =========================
       新人豪禮
    ========================= */

    .offer-title {
      position: relative;

      margin-top: 32px;

      color: #ffffff;

      font-size: clamp(38px, 10vw, 54px);
      line-height: 1.15;

      font-weight: 900;

      letter-spacing: 3px;

      text-shadow:
        0 3px 0 rgba(0, 0, 0, 0.16),
        0 0 14px rgba(255, 255, 255, 0.05);
    }


    /* =========================
       CHAMPAGNE DIVIDER
    ========================= */

    .gold-divider {
      width: 58%;
      max-width: 260px;

      height: 1px;

      margin:
        20px
        auto
        0;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(233, 199, 111, 0.65),
          transparent
        );

      box-shadow:
        0 0 10px rgba(215, 174, 79, 0.12);
    }


    /* =========================
       DESCRIPTION
    ========================= */

    .description {
      margin-top: 34px;

      color: #a6b9b0;

      font-size: 16px;
      line-height: 1.85;

      font-weight: 400;

      letter-spacing: 0.2px;
    }

    .description strong {
      color: #ead39a;

      font-weight: 700;
    }


    /* =========================
       DIVIDER
    ========================= */

    .divider {
      position: relative;

      width: 78px;
      height: 1px;

      margin:
        33px
        auto
        29px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(87, 181, 135, 0.45),
          transparent
        );
    }

    .divider::after {
      content: "";

      position: absolute;

      width: 27px;
      height: 2px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background: #65d49a;

      box-shadow:
        0 0 8px rgba(71, 210, 145, 0.50);
    }


    /* =========================
       QUESTION
    ========================= */

    .question {
      margin-bottom: 25px;

      color: #ffffff;

      font-size: 19px;
      line-height: 1.4;

      font-weight: 800;

      letter-spacing: 0.4px;
    }


    /* =========================
       BUTTON GROUP
    ========================= */

    .buttons {
      display: flex;
      flex-direction: column;

      gap: 14px;
    }

    .cta {
      width: 100%;
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 15px;

      text-decoration: none;

      font-size: 18px;
      font-weight: 750;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;
    }

    .cta:active {
      transform: scale(0.985);
    }


    /* =========================
       PRIMARY CTA
    ========================= */

    .primary {
      gap: 14px;

      color: #05140c;

      background:
        linear-gradient(
          135deg,
          #79e5a6 0%,
          #49ca81 48%,
          #31b96d 100%
        );

      border:
        1px solid
        rgba(156, 245, 192, 0.45);

      box-shadow:
        0 12px 30px rgba(48, 185, 109, 0.18),
        0 0 22px rgba(69, 204, 130, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .primary:hover {
      box-shadow:
        0 16px 36px rgba(48, 185, 109, 0.25),
        0 0 27px rgba(69, 204, 130, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }

    .arrow {
      margin-left: 2px;

      font-size: 21px;
      line-height: 1;
    }


    /* =========================
       WHATSAPP
    ========================= */

    .whatsapp {
      gap: 10px;

      color: #78dfa5;

      border:
        1px solid
        rgba(82, 202, 135, 0.52);

      background:
        linear-gradient(
          180deg,
          rgba(16, 65, 49, 0.38),
          rgba(7, 42, 34, 0.42)
        );

      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .whatsapp:hover {
      background:
        linear-gradient(
          180deg,
          rgba(20, 81, 59, 0.46),
          rgba(9, 50, 39, 0.50)
        );
    }

    .whatsapp-icon {
      width: 23px;
      height: 23px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .whatsapp-icon svg {
      width: 100%;
      height: 100%;

      fill: currentColor;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 520px) {

      .page {
        align-items: flex-start;

        padding:
          max(30px, env(safe-area-inset-top))
          16px
          max(30px, env(safe-area-inset-bottom));
      }

      .card {
        max-width: 390px;

        padding:
          66px
          27px
          41px;

        border-radius: 29px;
      }

      .offer-number {
        font-size: clamp(82px, 25vw, 108px);

        letter-spacing: -5px;
      }

      .offer-title {
        margin-top: 31px;

        font-size: 39px;
      }

      .gold-divider {
        margin-top: 18px;
      }

      .description {
        margin-top: 31px;

        font-size: 15px;

        line-height: 1.9;
      }

      .divider {
        margin-top: 31px;
        margin-bottom: 28px;
      }

      .question {
        margin-bottom: 25px;

        font-size: 18px;
      }

      .cta {
        min-height: 62px;

        font-size: 17px;
      }
    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-width: 360px) {

      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .card {
        padding-left: 22px;
        padding-right: 22px;
      }

      .offer-number {
        font-size: 78px;
      }

      .offer-title {
        font-size: 35px;
      }

      .description {
        font-size: 14px;
      }

      .question {
        font-size: 17px;
      }

      .cta {
        font-size: 16px;
      }
    }


    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 768px) {

      .card {
        max-width: 610px;

        padding:
          78px
          60px
          54px;
      }

      .offer-number {
        font-size: 150px;
      }

      .offer-title {
        font-size: 56px;
      }

      .description {
        font-size: 18px;
      }

      .question {
        font-size: 22px;
      }

      .cta {
        min-height: 70px;

        font-size: 19px;
      }
    }

  </style>
</head>


<body>

  <main class="page">

    <section class="card">


      <!-- 250% -->

      <div class="offer">

        <span class="spark one"></span>
        <span class="spark two"></span>

            </svg>

          </span>

          <span>

        </a>


      </div>

    </section>

  </main>

</body>
</html>
